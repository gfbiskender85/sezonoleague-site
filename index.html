<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --night0:#050924; --night1:#081446; --night2:#0D226F;
  --chrome0:#0C1A57; --chrome1:#050B2B;
  --white:#FFFFFF; --cream:#F5F1E6; --t2:rgba(245,241,230,.76); --t3:rgba(245,241,230,.54);
  --gold:#EFC987; --gold-deep:#F4D06F; --turq:#4FE3E0;
  --line:rgba(159,178,232,.18);
  --card:linear-gradient(180deg,rgba(13,34,111,.58),rgba(8,20,70,.55));
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --accent:Anton,"Barlow Condensed",Impact,sans-serif;
  --body:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mark:url("img/bd353e4940.png");
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--night0);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.lead{font-size:clamp(16.5px,1.4vw,19px);color:var(--t2);max-width:54ch}

/* brand lock-up: SEZONO / LEAGUE, Anton accent Z + G, -7deg */
.lock{display:inline-grid;justify-items:start;font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.92;letter-spacing:.14em;color:var(--white)}
.lock>span{display:block;white-space:nowrap}
.lock .l2{color:var(--gold)}
.lock i{font-style:normal;font-family:var(--accent);font-weight:400;display:inline-block;font-size:.816em;line-height:1;vertical-align:baseline;margin:0 .09em;transform:rotate(-7deg);transform-origin:50% 50%}
.lock .l1 i{color:var(--gold)}
.lock .l2 i{color:var(--white)}
.lock-sm{font-size:17px;letter-spacing:.16em}
.lock-xl{font-size:clamp(42px,6vw,80px);letter-spacing:.12em}
.mark{background:var(--mark) center/contain no-repeat}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:linear-gradient(180deg,rgba(12,26,87,.95),rgba(5,11,43,.95));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:66px}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--turq),var(--gold));transition:width .1s linear}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{width:36px;height:36px;flex:none}
.navlinks{display:flex;gap:24px;margin-left:auto;font-weight:500;font-size:15px}
.navlinks a{text-decoration:none;color:var(--t2)}
.navlinks a:hover{color:var(--cream)}

/* language menu */
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--body);letter-spacing:.02em;color:var(--cream);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:9px 11px;cursor:pointer}
.lang-btn:hover{background:rgba(255,255,255,.12)}
.lang-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
.lang-btn .chev{width:11px;height:11px;transition:transform .18s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:172px;margin:0;padding:6px;list-style:none;background:#0A1547;border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 40px -18px rgba(0,0,0,.9);z-index:50}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;font:500 14px/1.2 var(--body);color:var(--t2);background:none;border:0;border-radius:7px;padding:10px 11px;cursor:pointer;text-align:left}
.lang-menu button:hover{background:rgba(255,255,255,.08);color:var(--cream)}
.lang-menu button[aria-selected="true"]{color:var(--gold)}
.lang-menu button[aria-selected="true"]::after{content:"";width:14px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-3px);flex:none}
.lang-menu .code{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--t3)}

.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:13px 22px;border-radius:8px;border:1px solid transparent;transition:transform .15s,background .15s;cursor:pointer}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn-gold{background:var(--gold-deep);color:#1A1405}
.btn-gold:hover{background:#F8DB88}
.btn-ghost{border-color:rgba(245,241,230,.42);color:var(--cream)}
.btn-ghost:hover{background:rgba(245,241,230,.08)}
.btn svg{width:20px;height:20px;fill:currentColor}
.nav .btn{padding:9px 16px;font-size:16px}
@media(max-width:900px){.navlinks{display:none}.nav .wrap{gap:12px}.lang{margin-left:auto}.nav .btn{display:none}}

/* hero */
.hero{position:relative;background:radial-gradient(120% 90% at 70% 8%,#14318F 0%,#0A1A5E 42%,var(--night0) 100%);overflow:hidden}
.hero .pitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:32px;padding-block:70px 34px;min-height:540px}
.hero h1{font-size:clamp(54px,8vw,116px);font-weight:700;text-transform:uppercase;line-height:.9;color:var(--white);margin-top:14px}
.hero h1 em{font-style:normal;color:var(--gold-deep)}
.hero .lead{margin-top:20px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;align-items:center}
.hero .note{font-size:13px;color:var(--t3);margin-top:14px}
.hero .fig{position:relative;justify-self:center;width:min(100%,420px);display:grid;justify-items:center;gap:18px}
.hero .fig .mark{width:min(100%,290px);aspect-ratio:1;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.scrollcue{display:flex;align-items:center;gap:12px;padding-block:8px 26px;color:var(--t3);font:600 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;position:relative}
.scrollcue .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.scrollcue .arrow{width:22px;height:22px;border-radius:50%;border:1px solid rgba(239,201,135,.5);display:grid;place-items:center;color:var(--gold);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-block:44px 24px;min-height:0}.hero .fig{order:-1;width:100%}.hero .fig .mark{width:min(54%,200px)}}

/* ledger strip */
.strip{background:linear-gradient(180deg,var(--chrome0),var(--chrome1));border-top:1px solid rgba(239,201,135,.35);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.strip .cell{padding:22px 24px 22px 0;border-right:1px solid var(--line)}
.strip .cell+.cell{padding-left:24px}
.strip .cell:last-child{border-right:0}
.strip .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:600}
.strip .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1;margin-top:4px}
.strip .s{font-size:14.5px;color:var(--t2);margin-top:2px}
@media(max-width:760px){.strip .wrap{grid-template-columns:1fr}.strip .cell{border-right:0;border-bottom:1px solid var(--line);padding:16px 0}.strip .cell+.cell{padding-left:0}.strip .cell:last-child{border-bottom:0}}
</style>

<style>
/* ---- story ---- */
.story-intro{padding-block:clamp(56px,7vw,92px) 10px}
.story-intro h2{font-size:clamp(36px,5vw,58px);font-weight:700;text-transform:uppercase;margin-top:10px}
.story-intro .lead{margin-top:14px}
.story{position:relative}
.story::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(159,178,232,.22) 8%,rgba(159,178,232,.22) 92%,transparent);pointer-events:none}
@media(max-width:900px){.story::before{left:22px}}

.chapter{position:relative;padding-block:clamp(48px,7vw,86px);overflow:hidden}
.chapter .wrap{position:relative;display:grid;grid-template-columns:1fr minmax(260px,380px);gap:clamp(26px,5vw,68px);align-items:center}
.chapter.flip .ch-copy{order:2}
.chapter.flip .wrap{grid-template-columns:minmax(260px,380px) 1fr}
.ch-num{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.ch-num .num{font-family:var(--accent);font-size:clamp(34px,4.4vw,52px);line-height:.8;color:var(--gold);letter-spacing:.02em}
.ch-num .k{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.ch-num::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(239,201,135,.5),transparent);align-self:center}
.chapter h2{font-size:clamp(30px,4.2vw,50px);font-weight:700;text-transform:uppercase;color:var(--white)}
.chapter .lead{margin-top:14px}
.ghost{position:absolute;width:min(46vw,420px);aspect-ratio:1.1;background-position:center;background-repeat:no-repeat;background-size:contain;opacity:.05;pointer-events:none}
.ghost.right{right:-4%;bottom:-8%}
.ghost.left{left:-6%;top:-6%;transform:scaleX(-1)}

/* phone stage + decoration */
.stage{position:relative;display:grid;place-items:center;isolation:isolate}
.stage::before{content:"";position:absolute;z-index:-1;inset:-10% -16%;background:radial-gradient(58% 48% at 50% 42%,rgba(79,227,224,.22),rgba(13,34,111,0) 72%)}
.stage::after{content:"";position:absolute;z-index:-1;left:50%;bottom:2%;width:74%;height:26px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.65),transparent 70%);filter:blur(6px)}
.device{position:relative;width:min(100%,238px);aspect-ratio:600/1304;border-radius:40px;padding:6px;background:#070B22;border:1px solid rgba(159,178,232,.34);box-shadow:0 46px 70px -34px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.06);transform:rotate(-2deg)}
.chapter.flip .device{transform:rotate(2deg)}
.device img{width:100%;height:100%;object-fit:cover;border-radius:35px}
.device::after{content:"";position:absolute;inset:6px;border-radius:35px;background:linear-gradient(145deg,rgba(255,255,255,.14),transparent 38%);pointer-events:none}
.chip{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1 var(--body);letter-spacing:.01em;color:var(--cream);background:rgba(9,21,72,.82);border:1px solid rgba(239,201,135,.42);border-radius:999px;padding:9px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 14px 26px -14px rgba(0,0,0,.9);white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.chip.live::before{background:var(--turq);box-shadow:0 0 0 3px rgba(79,227,224,.22)}
.chip-a{top:9%;left:-6%}
.chip-b{bottom:13%;right:-8%}
.stage-board .chip-a{top:-6%;left:-3%}
.stage-board .chip-b{bottom:-7%;right:-3%}
@media(max-width:900px){
  .chapter .wrap,.chapter.flip .wrap{grid-template-columns:1fr;gap:26px;padding-left:44px}
  .chapter.flip .ch-copy{order:0}
  .story::before{left:22px}
  .ch-num{margin-left:-44px}
  .ch-num .num{width:44px;text-align:left}
  .device{width:min(100%,228px)}
  .chip-a{left:0}.chip-b{right:0}
}
@media(max-width:420px){.chip{font-size:11.5px;padding:8px 11px}.chip-b{bottom:8%}}

/* rooms gallery */
.sec{padding-block:clamp(56px,7vw,92px)}
.sec-head{max-width:720px;margin-bottom:38px}
.sec-head h2{font-size:clamp(32px,4.4vw,52px);font-weight:700;text-transform:uppercase;margin-top:10px}
.sec-head .lead{margin-top:14px}
.gallery{background:linear-gradient(180deg,var(--night0),var(--night1) 55%,var(--night0))}
.room-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,2.4vw,30px);align-items:start}
.room{margin:0;display:grid;gap:16px;justify-items:center}
.room .device{transform:none;width:min(100%,210px)}
.room figcaption{text-align:center;max-width:26ch}
.room h3{font-size:22px;font-weight:600;text-transform:uppercase}
.room p{color:var(--t2);font-size:14.5px;margin-top:6px}
@media(max-width:980px){.room-grid{grid-template-columns:repeat(2,1fr);gap:34px}}
@media(max-width:520px){.room-grid{grid-template-columns:1fr;gap:40px}}

/* manifesto / maker / final / footer */
.manifesto{background:linear-gradient(180deg,var(--night2),var(--night1));position:relative;overflow:hidden;border-block:1px solid var(--line)}
.manifesto .wrap{padding-block:clamp(56px,7vw,84px);display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative}
.manifesto blockquote{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(38px,6vw,80px);line-height:.92;color:var(--white)}
.manifesto blockquote em{font-style:normal;color:var(--gold-deep)}
.manifesto .side{color:var(--t2);font-size:16.5px;display:flex;flex-direction:column;gap:14px;border-left:2px solid rgba(239,201,135,.6);padding-left:22px}
.manifesto .pitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media(max-width:900px){.manifesto .wrap{grid-template-columns:1fr}}

.maker{padding-block:clamp(52px,6vw,80px)}
.maker .wrap{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;max-width:920px}
.maker .pic{width:120px;height:120px;flex:none}
.maker h2{font-size:32px;font-weight:600;text-transform:uppercase;margin-bottom:10px}
.maker p{color:var(--t2);max-width:58ch}
@media(max-width:600px){.maker .wrap{grid-template-columns:1fr}}

.final{background:radial-gradient(90% 80% at 50% 100%,#14318F 0%,var(--night1) 52%,var(--night0) 100%);text-align:center;padding-block:clamp(64px,8vw,96px)}
.final .mark{width:104px;height:104px;margin:0 auto 18px}
.final .lock{justify-items:center;margin-bottom:16px}
.final .lead{margin-inline:auto;text-align:center}
.final .cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
.final .note{font-size:13px;color:var(--t3);margin-top:16px}
footer{background:var(--night0);border-top:1px solid var(--line);padding-block:32px;font-size:14px;color:var(--t3)}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:center}
footer .links{display:flex;flex-wrap:wrap;gap:20px;margin-left:auto}
footer a{color:var(--t2);text-decoration:none}
footer a:hover{color:var(--cream)}

/* reveal */
.reveal{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
.reveal.pending{opacity:0;transform:translateY(22px)}
.reveal.is-in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal,.reveal.pending{opacity:1!important;transform:none!important;transition:none}
  .btn{transition:none}
  .scrollcue .arrow{animation:none}
}

/* ── lansman: geri sayım + bekleme listesi (2026-09-19) ── */
.kick{font:600 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:22px 0 0}
.cdown{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.cdown div{min-width:74px;background:rgba(5,11,43,.55);border:1px solid rgba(159,178,232,.28);border-radius:10px;padding:10px 8px}
.cdown b{display:block;font:400 30px/1 var(--display);color:var(--cream);font-variant-numeric:tabular-nums}
.cdown span{display:block;font:500 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-top:6px}
.signup{margin:26px auto 0;max-width:430px}
.signup .row{display:flex;gap:8px;flex-wrap:wrap}
.signup input{flex:1 1 210px;min-width:0;font:400 15px/1.2 var(--body);color:var(--cream);background:rgba(255,255,255,.06);
  border:1px solid rgba(159,178,232,.32);border-radius:10px;padding:13px 14px}
.signup input::placeholder{color:var(--t3)}
.signup input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.signup button{flex:0 0 auto}
.signup button[disabled]{opacity:.6;cursor:progress}
.tester{display:flex;align-items:flex-start;gap:9px;margin:14px 0 0;text-align:left;cursor:pointer;
  font:400 13.5px/1.45 var(--body);color:var(--t2)}
.tester input{flex:none;width:17px;height:17px;margin:1px 0 0;accent-color:var(--gold);cursor:pointer}
.plat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:10px 0 0;padding-left:26px;text-align:left;
  font:400 12.5px/1.4 var(--body);color:var(--t3)}
.plat label{display:inline-flex;align-items:center;gap:6px;color:var(--t2);cursor:pointer;white-space:nowrap}
.plat input{accent-color:var(--gold);cursor:pointer}
.sig-msg{min-height:20px;margin:10px 0 0;font:500 13px/1.4 var(--body);color:var(--gold)}
.sig-msg.bad{color:#FF9DA8}
.sig-note{margin:6px 0 0;font:400 12px/1.5 var(--body);color:var(--t3)}
.sig-note a{color:var(--t2);text-decoration:underline}
/* satır içi span'a genişlik işlemiyordu: kapanış bölümündeki işaret canlıda da
   0 px genişlikle çiziliyordu (2026-09-19 ölçümü) */
.final .mark{display:block}
.final .cta{margin-top:26px}
.btn.is-soon{cursor:default;opacity:.62;border-style:dashed}
.btn.is-soon em{font-style:normal;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--gold)}
@media(max-width:520px){.cdown div{min-width:66px}.cdown b{font-size:25px}}
</style>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Sezono League">
      <span class="mark" aria-hidden="true"></span>
      <span class="lock lock-sm" aria-hidden="true"><span class="l1">SE<i>Z</i>ONO</span><span class="l2">LEA<i>G</i>UE</span></span>
    </a>
    <nav class="navlinks">
      <a href="#story" data-i18n="nav.story"></a>
      <a href="#rooms" data-i18n="nav.rooms"></a>
      <a href="#manifesto" data-i18n="nav.manifesto"></a>
      <a href="#maker" data-i18n="nav.maker"></a>
    </nav>
    <div class="lang">
      <button class="lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9S14.5 18.4 12 21c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></svg>
        <span id="langLabel">English</span>

(function(){
  var KEY="sezono.lang", DEFAULT="en";
  var btn=document.getElementById("langBtn"), menu=document.getElementById("langMenu"), label=document.getElementById("langLabel");
  var options=Array.prototype.slice.call(menu.querySelectorAll("button[data-lang]"));
  var names={en:"English",tr:"Türkçe",es:"Español"};

  function stored(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function store(v){ try{ localStorage.setItem(KEY,v); }catch(e){} }

  function apply(lang){
    var dict=I18N[lang]||I18N[DEFAULT];
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var v=dict[el.getAttribute("data-i18n")]; if(v!=null) el.textContent=v;
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function(el){
      var v=dict[el.getAttribute("data-i18n-html")]; if(v!=null) el.innerHTML=v;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
      var v=dict[el.getAttribute("data-i18n-ph")]; if(v!=null) el.setAttribute("placeholder",v);
    });
    document.documentElement.lang=lang;
    label.textContent=names[lang]||names[DEFAULT];
    options.forEach(function(o){ o.setAttribute("aria-selected", String(o.dataset.lang===lang)); });
  }

  function openMenu(open){
    menu.hidden=!open;
    btn.setAttribute("aria-expanded", String(open));
    if(open){ var sel=menu.querySelector('[aria-selected="true"]')||options[0]; sel.focus(); }
  }
  btn.addEventListener("click", function(e){ e.stopPropagation(); openMenu(menu.hidden); });
  options.forEach(function(o,i){
    o.addEventListener("click", function(){ var l=o.dataset.lang; apply(l); store(l); openMenu(false); btn.focus(); });
    o.addEventListener("keydown", function(e){
      if(e.key==="ArrowDown"){ e.preventDefault(); options[(i+1)%options.length].focus(); }
      if(e.key==="ArrowUp"){ e.preventDefault(); options[(i-1+options.length)%options.length].focus(); }
    });
  });
  document.addEventListener("click", function(e){ if(!menu.hidden && !menu.contains(e.target) && e.target!==btn) openMenu(false); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !menu.hidden){ openMenu(false); btn.focus(); } });

  var start=stored();
  apply(I18N[start]?start:DEFAULT);

  /* scroll progress */
  var bar=document.getElementById("progress"), ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      var h=document.documentElement.scrollHeight-window.innerHeight;
      bar.style.width=(h>0?Math.min(100,Math.max(0,window.scrollY/h*100)):0)+"%";
      ticking=false;
    });
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll);
  onScroll();

  /* reveal on scroll — anything already on screen stays visible */
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var items=Array.prototype.slice.call(document.querySelectorAll(".reveal"));
  if(reduce || !("IntersectionObserver" in window)){
    items.forEach(function(el){ el.classList.add("is-in"); });
  }else{
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.remove("pending"); en.target.classList.add("is-in"); io.unobserve(en.target); }
      });
    },{rootMargin:"0px 0px -12% 0px",threshold:.08});
    items.forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.top < window.innerHeight*0.92){ el.classList.add("is-in"); }
      else { el.classList.add("pending"); io.observe(el); }
    });
  }
})();
</script>


<script>
/* Lansman (2026-09-19): geri sayım + bekleme listesi.
   Sözlük ve dil seçimi yukarıdaki I18N/`sezono.lang` ile aynı kaynaktan okunur. */
(function(){
  var API = "https://futbol-tycoon-api-production.up.railway.app/api/waitlist";
  var LAUNCH = new Date("2026-10-18T21:00:00+03:00");
  function lang(){
    try { var l = localStorage.getItem("sezono.lang"); if (l && I18N[l]) return l; } catch(e){}
    return document.documentElement.lang && I18N[document.documentElement.lang] ? document.documentElement.lang : "en";
  }
  function t(k){ var d = I18N[lang()] || I18N.en; return d[k] || I18N.en[k] || ""; }

  /* geri sayım */
  var d = document.getElementById("cd-d"), h = document.getElementById("cd-h"),
      m = document.getElementById("cd-m"), s = document.getElementById("cd-s");
  function two(n){ return (n < 10 ? "0" : "") + n; }
  function tick(){
    if (!d) return;
    var ms = LAUNCH - new Date();
    if (ms < 0) ms = 0;
    var x = Math.floor(ms / 1000);
    var dd = Math.floor(x / 86400); x -= dd * 86400;
    var hh = Math.floor(x / 3600);  x -= hh * 3600;
    var mm = Math.floor(x / 60);
    d.textContent = dd; h.textContent = two(hh); m.textContent = two(mm); s.textContent = two(x - mm * 60);
  }
  tick(); setInterval(tick, 1000);

  /* bekleme listesi */
  var form = document.getElementById("signup");
  if (!form) return;
  var input = document.getElementById("wl-email"), msg = document.getElementById("wl-msg");
  /* testçi kutusu: işaretlenince cihaz seçimi açılır (kapalı testte davet yolu ayrışıyor) */
  var test = document.getElementById("wl-test"), plat = document.getElementById("wl-plat");
  if (test && plat) test.addEventListener("change", function(){ plat.hidden = !test.checked; });
  var btn = form.querySelector("button[type=submit]"), sent = false;
  function say(text, bad){ msg.textContent = text; msg.className = "sig-msg" + (bad ? " bad" : ""); }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (sent) return;
    var email = (input.value || "").trim();
    if (email.length < 6 || email.indexOf("@") < 1 || email.indexOf(".", email.indexOf("@")) < 0){
      say(t("wl.bad"), true); input.focus(); return;
    }
    btn.disabled = true; say(t("wl.wait"), false);
    var wantsTest = !!(test && test.checked);
    var picked = form.querySelector("input[name=plat]:checked");
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: email, lang: lang(), source: "site",
        wantsTest: wantsTest,
        platform: wantsTest && picked ? picked.value : null
      })
    }).then(function(r){ return r.json().catch(function(){ return null; }).then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(r){
        if (r.ok && r.j && r.j.success){
          sent = true; say(t(wantsTest ? "wl.oktest" : "wl.ok"), false);
          input.disabled = true; btn.disabled = true;
        } else {
          var code = r.j && r.j.error && r.j.error.code;
          say(code === "INVALID_EMAIL" ? t("wl.bad") : t("wl.err"), true);
          btn.disabled = false;
        }
      })
      .catch(function(){ say(t("wl.err"), true); btn.disabled = false; });
  });
})();
</script>
